name: Mio Linux checks

on:
  push:
    paths: ['mio_linux/**', 'tests/test_*.py', 'tests/smoke_gui.py', 'tests/__init__.py', 'assets/**', 'run.sh', '.github/workflows/mio.yml']
  pull_request:
    paths: ['mio_linux/**', 'tests/test_*.py', 'tests/smoke_gui.py', 'tests/__init__.py', 'assets/**', 'run.sh', '.github/workflows/mio.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 xvfb fonts-noto-cjk
      - name: Unit checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Native GUI smoke test
        env:
          GSETTINGS_BACKEND: memory
          GSK_RENDERER: cairo
        run: xvfb-run -a python3 -m tests.smoke_gui
      - name: Upload GUI report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mio-gui-checks
          path: artifacts/
